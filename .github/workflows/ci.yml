name: ci

# Runs the engine unit tests on every push. The site itself is deployed by Vercel,
# which builds every commit on this branch (including the bot's daily data commits).
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Engine unit tests
        run: node --test tests/*.test.mjs
